name: Java CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # !!!! ВАЖНО: Заменили ubuntu-latest на windows-latest
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Этот шаг уже содержит встроенный PowerShell-скрипт,
      # поэтому мы просто вызываем его без дополнительных команд.
      - name: Start SUT in background 🚀
        run: .\start-sut.ps1

      # Основной шаг — прогон тестов
      - name: Run tests ✅
        # Для совместимости с WSL/Linux используем bat-версию Gradle Wrapper
        run: ./gradlew.bat test --no-daemon

      # Остановка сервиса после выполнения всех шагов
      - name: Stop SUT ⛔️
        if: always()
        run: |
          kill $(cat app.pid) || true